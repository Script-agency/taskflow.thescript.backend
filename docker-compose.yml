version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
    container_name: taskflow-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      # Mount source for development (hot-reload PHP changes)
      - ./keys:/app/keys:delegated
      - ./runtime:/app/runtime:delegated
      - ./web:/app/web:delegated
      - ./config:/app/config:delegated
      - ./core:/app/core:delegated
      - ./modules:/app/modules:delegated
      - ./commands:/app/commands:delegated
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cache

  webserver:
    image: nginx:1.25-alpine
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./local.taskflow.thescript.agency.pem:/etc/nginx/certs/local.taskflow.thescript.agency.pem
      - ./local.taskflow.thescript.agency-key.pem:/etc/nginx/certs/local.taskflow.thescript.agency-key.pem
    depends_on:
      - app

  cache:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data: