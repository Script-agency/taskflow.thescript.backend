server {
    listen 80;
    server_name local.taskflow.thescript.agency;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name local.taskflow.thescript.agency;

    ssl_certificate     /etc/nginx/certs/local.taskflow.thescript.agency.pem;
    ssl_certificate_key /etc/nginx/certs/local.taskflow.thescript.agency-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /app/web;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}